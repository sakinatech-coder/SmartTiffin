<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dal Chawal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<section class="menu">
  <h2>Choose Your Dal Rice</h2>

  <div class="meal-grid">

    <div class="meal-card">
      <img src="dal.jpg" alt="Only Dal Rice">
      <h3>Only Dal Rice</h3>
      <p>₹79</p>
      <button class="btn">Order Now</button>
    </div>

    <div class="meal-card">
      <img src="dal-salad.jpg" alt="Dal Rice Salad">
      <h3>Dal Rice + Salad</h3>
      <p>₹99</p>
      <button class="btn">Order Now</button>
    </div>

    <div class="meal-card">
      <img src="jeera-dal.jpg" alt="Jeera Dal Rice">
      <h3>Jeera Dal Rice</h3>
      <p>₹109</p>
      <button class="btn">Order Now</button>
    </div>

    <div class="meal-card">
      <img src="dal-combo.jpg" alt="Dal Combo">
      <h3>Dal Combo</h3>
      <p>₹119</p>
      <button class="btn">Order Now</button>
    </div>

  </div>
</section>

</body>
</html>
