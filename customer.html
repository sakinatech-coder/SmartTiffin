<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Now | Smart Tiffin</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">
  <a href="index.html" class="logo">
    <div class="logo-icon">🍱</div>
    <h2>Smart Tiffin</h2>
  </a>

  <nav>
    <a href="index.html">Home</a>
    <a href="menu.html">Menu</a>
  </nav>
</header>

<section class="contact">

  <div class="section-heading">
    <div class="small-title">PLACE ORDER</div>
    <h2>Order Your Homemade Meal</h2>
    <p>Fill your details and we'll contact you.</p>
  </div>

  <form class="contact-form">

    <input type="text" placeholder="Full Name" required>

    <input type="tel" placeholder="Phone Number" required>

    <input type="text" placeholder="Delivery Address" required>

    <select required>
      <option value="">Select Meal</option>
      <option>Classic Veg - ₹79</option>
      <option>Aloo Paratha - ₹89</option>
      <option>Gobi Paratha - ₹89</option>
      <option>Paneer Meal - ₹129</option>
      <option>Palak Paneer Thali - ₹229</option>
      <option>Shahi Paneer Thali - ₹249</option>
    </select>

    <textarea placeholder="Special Instructions"></textarea>

    <button type="submit">
      Confirm Order
    </button>

  </form>

</section>

<footer class="footer">
  <p>© 2026 Smart Tiffin</p>
</footer>

</body>
</html>
