<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Makki Di Roti & Sarson Da Saag - Smart Tiffin</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Roboto,Arial,sans-serif;background:#f8f5ee;color:#1f2937}
    .topbar{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:14px 5%;box-shadow:0 2px 8px rgba(0,0,0,.08)}
    .topbar h2{font-size:20px}
    .topbar a{color:#1f2937;text-decoration:none;font-size:14px}
    h1{text-align:center;font-size:22px;margin:26px 0 6px}
    .note{text-align:center;font-size:13px;color:#166534;margin-bottom:20px;padding:0 5%}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;max-width:1100px;margin:0 auto;padding:0 5% 50px}
    .card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.1);text-align:center}
    .pic{height:170px;display:flex;align-items:center;justify-content:center;font-size:60px;background:linear-gradient(135deg,#fff8e1,#e8f5e9)}
    .pic img{width:100%;height:100%;object-fit:cover;display:block}
    .card h3{font-size:17px;margin:12px 8px 4px}
    .desc{font-size:12px;color:#6b7280;margin-bottom:8px;padding:0 10px;min-height:32px}
    .price{font-size:20px;font-weight:700;color:#166534;margin-bottom:10px}
    .order{display:block;background:#16a34a;color:#fff;padding:12px;text-decoration:none;font-weight:600}
    .order:hover{background:#166534}
  </style>
</head>
<body>

<div class="topbar">
  <h2>🌾 Makki Di Roti & Sarson Da Saag</h2>
  <a href="menu.html">← Back</a>
</div>

<h1>Choose Your Punjabi Favourite</h1>
<p class="note">❄️ winter special(Oct to Feb)</p>
<div class="grid" id="grid"></div>

<script>
  const ITEMS = [
    { name:"Makki Di Roti (1 pc)",        img:"makki_roti.jpg",         price:20,  icon:"🫓" },
    { name:"Sarson Da Saag (1 Bowl)",     img:"sarson_saag.jpg",        price:60,  icon:"🥬"},
    { name:"Saag + 2 Makki Roti",         img:"saag_2_roti.jpg",        price:99,  icon:"🍽️"},
    { name:"Saag + 2 Roti + Makhan",      img:"saag_makhan.jpg",        price:119, icon:"🧈"},
    { name:"Saag Roti + Lassi Combo",     img:"saag_lassi_combo.jpg",   price:139, icon:"🥛" },
    { name:"Extra Makhan",                img:"makhan.jpg",             price:10,  icon:"🧈"},
    { name:"Gur (Jaggery)",               img:"gur.jpg",                price:10,  icon:"🟤"}
  ];

  const grid = document.getElementById("grid");
  ITEMS.forEach(item => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="pic"><img src="../${item.img}" alt="${item.name}" onerror="this.style.display='none'; this.parentNode.textContent='${item.icon}'"></div>
      <h3>${item.name}</h3>
      <p class="desc">${item.desc}</p>
      <div class="price">₹${item.price}</div>
      <a class="order" href="order.html?meal=${encodeURIComponent(item.name)}&price=${item.price}">Order Now</a>
    `;
    grid.appendChild(card);
  });
</script>
</body>
</html>
