<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | SmartTiffin</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    min-height: 100vh;
    background: #f8f5ee;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.container {
    width: 100%;
    max-width: 1000px;
    min-height: 620px;
    display: grid;
    grid-template-columns: 1fr 1.1fr;
    background: white;
    border-radius: 25px;
    overflow: hidden;
    box-shadow: 0 18px 55px rgba(15, 90, 71, 0.13);
}

/* LEFT PANEL */
.welcome-panel {
    background: linear-gradient(145deg, #0f5a47, #073d32);
    color: white;
    padding: 55px 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    overflow: hidden;
}

.welcome-panel::before {
    content: "";
    position: absolute;
    width: 280px;
    height: 280px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 50%;
    right: -100px;
    top: -80px;
}

.logo {
    font-size: 35px;
    font-weight: 800;
    margin-bottom: 35px;
}

.logo span {
    color: #f4a21d;
}

.welcome-panel h1 {
    font-size: 32px;
    line-height: 1.35;
    margin-bottom: 18px;
}

.welcome-panel h1 span {
    color: #f4a21d;
}

.welcome-panel p {
    color: #e2eee9;
    font-size: 14px;
    line-height: 1.9;
}

.food-icons {
    font-size: 35px;
    margin-top: 35px;
    letter-spacing: 8px;
}

.tagline {
    margin-top: 35px;
    color: #f4a21d;
    font-size: 14px;
    font-weight: 600;
}

/* RIGHT PANEL */
.form-panel {
    padding: 45px 55px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.form-panel h2 {
    color: #0f5a47;
    font-size: 28px;
    margin-bottom: 8px;
}

.subtitle {
    color: #888;
    font-size: 13px;
    margin-bottom: 28px;
}

.input-group {
    margin-bottom: 17px;
}

.input-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #333;
    margin-bottom: 7px;
}

.input-group input {
    width: 100%;
    padding: 13px 15px;
    border: 1px solid #e2e5e1;
    border-radius: 10px;
    outline: none;
    font-size: 13px;
    background: #fbfcfa;
    transition: 0.3s;
}

.input-group input:focus {
    border-color: #0f5a47;
    box-shadow: 0 0 0 3px rgba(15,90,71,0.08);
}

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 65px;
}

.toggle {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    color: #0f5a47;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
}

.register-btn {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    background: #0f5a47;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.3s;
}

.register-btn:hover {
    background: #f4a21d;
    color: #173d32;
    transform: translateY(-2px);
}

.login-link {
    text-align: center;
    margin-top: 23px;
    font-size: 13px;
    color: #777;
}

.login-link a,
.home-link a {
    color: #0f5a47;
    font-weight: 700;
    text-decoration: none;
}

.login-link a:hover,
.home-link a:hover {
    color: #f4a21d;
}

.home-link {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
}

@media(max-width: 750px) {
    body {
        padding: 15px;
    }

    .container {
        grid-template-columns: 1fr;
        max-width: 470px;
    }

    .welcome-panel {
        padding: 30px;
        min-height: 260px;
    }

    .logo {
        font-size: 27px;
        margin-bottom: 18px;
    }

    .welcome-panel h1 {
        font-size: 25px;
    }

    .food-icons {
        margin-top: 18px;
        font-size: 27px;
    }

    .tagline {
        margin-top: 15px;
    }

    .form-panel {
        padding: 35px 25px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- LEFT WELCOME PANEL -->
    <div class="welcome-panel">

        <div class="logo">🍱 Smart<span>Tiffin</span></div>

        <h1>Fresh Food.<br>
        <span>Happy Life!</span></h1>

        <p>
            Enjoy fresh, hygienic and delicious homemade meals.
            Bring the taste of home closer to you with SmartTiffin.
        </p>

        <div class="food-icons">
            🍛 🥗 🥘 🍱
        </div>

        <div class="tagline">
            Ghar ka khaana, sehat ka khazaana!
        </div>

    </div>


    <!-- RIGHT REGISTRATION FORM -->
    <div class="form-panel">

        <h2>Create Account</h2>

        <p class="subtitle">
            Join SmartTiffin and enjoy homemade food.
        </p>

        <form id="registerForm">

            <div class="input-group">
                <label>Full Name</label>
                <input
                    type="text"
                    name="fullname"
                    placeholder="Enter your full name"
                    required>
            </div>

            <div class="input-group">
                <label>Mobile Number</label>
                <input
                    type="tel"
                    name="mobile"
                    placeholder="Enter your mobile number"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    required>
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required>
            </div>

            <div class="input-group">
                <label>Create Password</label>

                <div class="password-box">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="6"
                        required>

                    <button
                        type="button"
                        class="toggle"
                        onclick="togglePassword()">
                        Show
                    </button>
                </div>
            </div>

            <button type="submit" class="register-btn">
                Create Account →
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

        <div class="home-link">
            <a href="index.html">← Back to Home</a>
        </div>

    </div>

</div>


<script>
function togglePassword() {
    const pass = document.getElementById("password");
    const btn = document.querySelector(".toggle");

    if (pass.type === "password") {
        pass.type = "text";
        btn.textContent = "Hide";
    } else {
        pass.type = "password";
        btn.textContent = "Show";
    }
}

document.getElementById("registerForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const name = document.querySelector('[name="fullname"]').value.trim();
    const mobile = document.querySelector('[name="mobile"]').value.trim();
    const email = document.querySelector('[name="email"]').value.trim().toLowerCase();
    const password = document.querySelector('[name="password"]').value;

    const account = {
        name: name,
        mobile: mobile,
        email: email,
        password: password
    };

    localStorage.setItem("smartTiffinAccount", JSON.stringify(account));

    sessionStorage.setItem("smartTiffinLoggedIn", "true");
    sessionStorage.setItem("smartTiffinUser", name);

    alert("Account created successfully! Welcome to SmartTiffin.");

    window.location.href = "index.html";
});
</script>

</body>
</html>
