
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | SmartTiffin</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f8f5ee;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

/* Main Container */
.login-container {
    width: 100%;
    max-width: 950px;
    min-height: 540px;
    display: flex;
    background: white;
    border-radius: 25px;
    overflow: hidden;
    box-shadow: 0 15px 45px rgba(0,0,0,0.12);
}

/* Left Side */
.login-left {
    width: 45%;
    background: linear-gradient(145deg, #0f5a47, #073c32);
    color: white;
    padding: 55px 35px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
}

.logo {
    font-size: 42px;
    margin-bottom: 15px;
}

.login-left h1 {
    font-size: 32px;
    margin-bottom: 15px;
}

.login-left h1 span {
    color: #f4a21d;
}

.login-left p {
    font-size: 15px;
    line-height: 1.8;
    color: #e5eee9;
}

.food-icon {
    font-size: 65px;
    margin: 35px 0;
}

.tagline {
    color: #ffc45b;
    font-weight: bold;
    font-size: 17px;
}

/* Right Side */
.login-right {
    width: 55%;
    padding: 55px 50px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.login-right h2 {
    color: #0f5a47;
    font-size: 30px;
    margin-bottom: 8px;
}

.subtitle {
    color: #777;
    margin-bottom: 30px;
    font-size: 14px;
}

.input-group {
    margin-bottom: 20px;
}

.input-group label {
    display: block;
    color: #333;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
}

.input-group input {
    width: 100%;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    background: #fafafa;
    transition: 0.3s;
}

.input-group input:focus {
    border-color: #0f5a47;
    background: white;
    box-shadow: 0 0 0 3px rgba(15,90,71,0.08);
}

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 65px;
}

.toggle {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: none;
    color: #0f5a47;
    cursor: pointer;
    font-weight: bold;
}

.login-btn {
    width: 100%;
    padding: 15px;
    background: #0f5a47;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    margin-top: 8px;
}

.login-btn:hover {
    background: #f4a21d;
    color: #173d32;
    transform: translateY(-2px);
}

.create-account {
    text-align: center;
    margin-top: 25px;
    color: #666;
    font-size: 14px;
}

.create-account a {
    color: #0f5a47;
    font-weight: bold;
    text-decoration: none;
}

.create-account a:hover {
    color: #f4a21d;
}

.home-link {
    text-align: center;
    margin-top: 20px;
}

.home-link a {
    color: #777;
    text-decoration: none;
    font-size: 14px;
}

.home-link a:hover {
    color: #0f5a47;
}

/* Mobile Responsive */
@media(max-width: 650px) {
    body {
        padding: 15px;
    }

    .login-container {
        flex-direction: column;
        max-width: 420px;
        border-radius: 20px;
    }

    .login-left {
        width: 100%;
        padding: 28px 20px;
    }

    .logo {
        font-size: 32px;
        margin-bottom: 8px;
    }

    .login-left h1 {
        font-size: 25px;
    }

    .login-left p {
        font-size: 13px;
    }

    .food-icon {
        font-size: 38px;
        margin: 12px 0;
    }

    .tagline {
        font-size: 14px;
    }

    .login-right {
        width: 100%;
        padding: 30px 24px;
    }

    .login-right h2 {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<div class="login-container">

    <!-- Left Welcome Section -->
    <div class="login-left">

        <div class="logo">🍱</div>

        <h1>Smart<span>Tiffin</span></h1>

        <p>
            Welcome to the taste of home!
            Fresh homemade meals delivered
            right to your doorstep.
        </p>

        <div class="food-icon">🥗 🍛 🥘</div>

        <div class="tagline">
            Ghar ka khaana, sehat ka khazaana!
        </div>

    </div>

    <!-- Login Form -->
    <div class="login-right">

        <h2>Welcome Back! 👋</h2>

        <p class="subtitle">
            Login to continue your food journey.
        </p>

        <form id="loginForm">

            <div class="input-group">
                <label>Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>
            </div>

            <div class="input-group">
                <label>Password</label>

                <div class="password-box">
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required>

                    <button
                        type="button"
                        class="toggle"
                        onclick="togglePassword()">
                        Show
                    </button>
                </div>
            </div>

            <button type="submit" class="login-btn">
                Login →
            </button>

        </form>

        <div class="create-account">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </div>

        <div class="home-link">
            <a href="index.html">← Back to Home</a>
        </div>

    </div>

</div>

<script>
function togglePassword() {
    const pass = document.getElementById("password");
    const btn = document.querySelector(".toggle");

    if (pass.type === "password") {
        pass.type = "text";
        btn.textContent = "Hide";
    } else {
        pass.type = "password";
        btn.textContent = "Show";
    }
}
</script>

</body>
</html>
