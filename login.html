<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Smart Tiffin</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <section class="login-page">

        <div class="login-box">

            <a href="index.html" class="login-logo">
                🍱 Smart Tiffin
            </a>

            <h1>Welcome Back!</h1>

            <p class="login-subtitle">
                Login to continue to Smart Tiffin
            </p>

            <form id="loginForm">

                <div class="login-form-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required>

                </div>

                <div class="login-form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required>

                        <button
                            type="button"
                            id="togglePassword">
                            Show
                        </button>

                    </div>

                </div>

                <div class="login-options">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>

                <button
                    type="submit"
                    class="login-submit-btn">
                    Login →
                </button>

            </form>

            <p class="register-text">
                Don't have an account?
                <a href="register.html">
                    Create Account
                </a>
            </p>

            <a
                href="index.html"
                class="back-home">
                ← Back to Home
            </a>

        </div>

    </section>

    <script src="js/script.js"></script>

</body>

</html>
